<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- Bootstrap CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Macondo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <title>SR GROUP OF MANAGEMENT & TECHNOLOGY</title>
  <link rel="stylesheet" href="static/home.css">
</head>

<body>
  <img src="/static/images/srimt_bg.JPG" id="bg-img">
  <!-- Search Bar -->
  <div class="container">
    <!-- Error Message -->
    <div id="error-message"></div>
    <div id="search-container" class="input-group mb-3">
      <!-- <div class="card-body" > -->
      <label for="search-name">SRxGLANCE</label><br>
      <input type="text" id="search-bar" placeholder="Want to know about SRIMT? Search for it here!" name="search-name"
        class="form-control">
      <div class="input-group-append">
        <button id="search-button" class="btn btn-outline-secondary">Search</button>
      </div>

      <!-- Suggestions list -->
      <div id="suggestions-list" class="suggestions"></div>
    </div>
  </div>
  <!-- </div> -->


  <script>
    // Tool data with value and URL pair
    const toolData = [
      //department section start
      {
        value: "department",
        url: "department/"
      },
      {
        value: "faculty",
        url: "department/"
      },
      {
        value: "teacher",
        url: "department/"
      },
      {
        value: "professor",
        url: "department/"
      },
      {
        value: "teachers",
        url: "department/"
      },
      {
        value:"professors",
        url: "department/"
      },
      //department section end

      // about section start
      {
        value: "about",
        url: "about-srimt/"
      },
      {
        value:"about srimt",
        url:"about-srimt/"
      },
      {
        value: "srimt",
        url: "about-srimt/"
      },
      {
        value: "srgi",
        url: "about-srimt/"
      },
      {
        value: "about srgi",
        url: "about-srimt/"
      },
      {
        value: "sr",
        url: "about-srimt/"
      },
      {
        value: "about sr",
        url: "about-srimt/"
      },
      //about section end
      {
        value: "gallary",
        url: "https://www.kali.org/tools/some-other-tool"
      },
      // Add more tools as needed
    ];

    // Select elements
    const searchBar = document.getElementById('search-bar');
    const searchButton = document.getElementById('search-button');
    const errorMessage = document.getElementById('error-message');
    const suggestionsList = document.getElementById('suggestions-list');

    // Function to filter tools based on input
    function showSuggestions(query) {
      // Filter tools that match the input query
      const suggestions = toolData.filter(tool => tool.value.toLowerCase().includes(query.toLowerCase()));

      // Clear the suggestions list
      suggestionsList.innerHTML = '';

      if (suggestions.length > 0) {
        // Display each suggestion in the list
        suggestions.forEach(suggestion => {
          const div = document.createElement('div');
          div.textContent = suggestion.value;
          div.addEventListener('click', function () {
            searchBar.value = suggestion.value;
            suggestionsList.style.display = 'none';
            searchTool(); // Automatically trigger search
          });
          suggestionsList.appendChild(div);
        });

        suggestionsList.style.display = 'block';
      } else {
        suggestionsList.style.display = 'none';
      }
    }

    // Function to search for the value and open the URL
    function searchTool() {
      const searchValue = searchBar.value.trim().toLowerCase();
      const tool = toolData.find(tool => tool.value.toLowerCase() === searchValue);

      if (tool) {
        // If a matching tool is found, open the URL
        window.open(tool.url, '_blank');
        errorMessage.textContent = ''; // Clear any error messages
        suggestionsList.style.display = 'none'; // Hide suggestions
      } else {
        // If no matching tool is found, display an error message
        errorMessage.textContent = 'data not found. Please check your input.';
        suggestionsList.style.display = 'none'; // Hide suggestions
      }

    }

    // Add event listener for search button
    searchButton.addEventListener('click', searchTool);

    // Handle keyup event to show suggestions while typing
    searchBar.addEventListener('keyup', function () {
      const query = searchBar.value.trim();
      if (query) {
        showSuggestions(query); // Show suggestions based on query
      } else {
        suggestionsList.style.display = 'none'; // Hide suggestions when input is empty
      }
    });

    // Optional: Allow pressing Enter key to trigger the search
    searchBar.addEventListener('keypress', function (event) {
      if (event.key === 'Enter') {
        searchTool();
      }
    });

    // Close suggestions if user clicks outside
    document.addEventListener('click', function (event) {
      if (!searchBar.contains(event.target) && !suggestionsList.contains(event.target)) {
        suggestionsList.style.display = 'none';
      }
    });
  </script>

  <!-- Optional JavaScript -->
  <!-- jQuery first, then Popper.js, then Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
    integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>

</body>

</html>
